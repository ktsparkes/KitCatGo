<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff8a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KitCatGo</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="KitCatGo">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7f0; --card: #ffffff; --ink: #3b2a22; --muted: #8a7468;
    --brand: #ff8a5c; --brand-dark: #e5673a; --line: #f0e0d4;
    --common: #9aa5b1; --uncommon: #4caf7a; --rare: #3d8bfd; --epic: #a45cf0; --legendary: #f5b400;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1714; --card: #2a221e; --ink: #f6ebe4; --muted: #b59e92; --line: #3d322c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Fredoka', system-ui, sans-serif; overflow: hidden; }
  button, input, textarea { font-family: inherit; font-size: 16px; }
  button { cursor: pointer; }

  /* Top bar */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center;
    gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); }
  #logo { font-weight: 700; font-size: 20px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
  #logo img { width: 34px; height: 34px; border-radius: 9px; }
  .pill { background: var(--card); border-radius: 999px; padding: 6px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #lvl { flex: 1; max-width: 220px; margin-left: auto; }
  #lvlNum { background: var(--brand); color: #fff; border-radius: 999px; min-width: 28px; height: 28px;
    display: grid; place-items: center; font-size: 14px; }
  #xpbar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #xpfill { height: 100%; width: 0; background: var(--brand); transition: width .4s; }

  /* Views */
  .view { position: fixed; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top));
    bottom: calc(64px + env(safe-area-inset-bottom)); overflow-y: auto; padding: 8px 16px 110px; display: none; }
  .view.on { display: block; }
  #mapView { padding: 0; }
  #map { position: absolute; inset: 0; background: #e8e0d8; }
  h2 { margin: 6px 0 2px; }
  .sub { color: var(--muted); margin-bottom: 14px; }

  /* Collection grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .photoCard { background: var(--card); border-radius: 16px; overflow: hidden; border: 2px solid var(--line); cursor: pointer; }
  .photoCard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .photoCard .info { padding: 6px 10px 8px; }
  .photoCard .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photoCard small { color: var(--muted); }
  #empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  #empty .catPic { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; }

  /* Catdex */
  #dexGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .dexCard { background: var(--card); border-radius: 16px; padding: 8px 6px 10px; text-align: center;
    border: 2px solid var(--line); position: relative; }
  .dexCard .catPic { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 4px; }
  .dexCard .nm { font-size: 13px; font-weight: 600; line-height: 1.1; }
  .dexCard .ct { position: absolute; top: 4px; right: 8px; font-size: 12px; font-weight: 700; color: var(--brand-dark); }
  .dexCard.unseen .catPic { filter: grayscale(1) blur(5px) opacity(.45); }
  .dexCard.unseen .nm { color: var(--muted); }

  /* Spot button */
  #spotBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom));
    z-index: 1100; background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 14px 26px;
    font-size: 19px; font-weight: 700; box-shadow: 0 6px 20px rgba(229,103,58,.45); white-space: nowrap; }
  #spotBtn:active { transform: translateX(-50%) scale(.96); }

  /* Bottom nav */
  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); background: var(--card); display: flex; z-index: 1000;
    border-top: 1px solid var(--line); }
  #nav button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #nav button span { font-size: 22px; }
  #nav button.on { color: var(--brand-dark); }

  /* Map pins */
  .pin { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background-size: cover;
    background-position: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(255,138,92,.25); }

  /* Sheets / modals */
  .sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.5); display: none;
    align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .sheetBox { background: var(--card); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheetBox img.big { width: 100%; max-height: 45vh; object-fit: cover; border-radius: 16px; display: block; }
  label.lbl { display: block; font-weight: 700; margin: 14px 0 6px; }
  .field { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .chip { background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px 2px 6px;
    text-align: center; font-size: 11px; font-weight: 600; color: var(--ink); }
  .chip .catPic { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; margin: 2px auto 3px; }
  .chip.on { border-color: var(--brand); background: rgba(255,138,92,.15); }
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 13px 24px;
    font-size: 17px; font-weight: 700; width: 100%; margin-top: 16px; }
  .btn.ghost { background: var(--bg); color: var(--ink); border: 2px solid var(--line); }
  .btn.danger { background: none; color: #d64545; margin-top: 8px; }
  .smallBtn { border: 0; background: var(--line); color: var(--ink); border-radius: 10px; padding: 12px; white-space: nowrap; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; }
  .meta { color: var(--muted); margin: 4px 0; }

  /* Celebration */
  #yay { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.6); display: none; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center; padding: 24px; }
  #yay.open { display: flex; }
  #yay .big { font-size: 38px; font-weight: 700; animation: pop .5s ease; }
  #yay img { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 6px solid #fff; margin: 16px 0; animation: pop .5s ease; }
  #yay .btn { max-width: 260px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

  /* Wild cats on the map */
  #yarnPill { display: none; }
  body.onMap #yarnPill { display: flex; }
  #mapBtns { position: absolute; right: 16px; bottom: 90px; z-index: 900; display: flex; flex-direction: column; gap: 10px; }
  .roundBtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink);
    box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 22px; }
  .roundBtn.on { background: var(--brand); color: #fff; }
  .wild { position: relative; width: 56px; height: 56px; animation: bob 1.6s ease-in-out infinite; }
  .wild img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .wild.far { opacity: .6; }
  .wild.far img { filter: saturate(.6); }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; border-radius: 999px;
    font-size: 12px; padding: 2px 7px; }
  .photoCard { position: relative; }

  /* Catch screen */
  #catch { position: fixed; inset: 0; z-index: 2600; display: none; flex-direction: column; align-items: center;
    background: linear-gradient(#bfe6ff, #e9f7d8 60%, #9ed680 60%, #7cc05e); touch-action: none; user-select: none; }
  #catch.open { display: flex; }
  #catchTop { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 0; color: #3b2a22; }
  #catchName { font-size: 22px; font-weight: 700; text-align: center; }
  #catchRarity { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; text-align: center; }
  #runBtn { background: rgba(255,255,255,.85); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; color: #3b2a22; }
  #catch .pill { color: #3b2a22; background: #fff; }
  #arena { position: relative; flex: 1; width: 100%; }
  #target { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 170px; height: 170px; }
  #target img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 5px solid #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: idle 2s ease-in-out infinite; }
  #target.dodge img { animation: dodge .4s ease; }
  #ring { position: absolute; left: 50%; top: 50%; border: 5px solid; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #ringOuter { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; border: 3px solid rgba(255,255,255,.8);
    border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  @keyframes idle { 50% { transform: translateY(-8px) scale(1.02); } }
  @keyframes dodge { 30% { transform: translateX(-40px) rotate(-10deg); } 70% { transform: translateX(30px) rotate(8deg); } }
  #ball { position: absolute; left: 50%; bottom: 70px; width: 80px; height: 80px; margin-left: -40px; font-size: 66px;
    line-height: 80px; text-align: center; touch-action: none; }
  #hint { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); width: 100%; text-align: center; color: #2d4a1f; font-weight: 600; padding: 0 16px; }
  .wobble { animation: wobble .5s ease; }
  @keyframes wobble { 25% { transform: rotate(-20deg); } 75% { transform: rotate(20deg); } }

  /* Cat Home */
  #room { position: relative; height: 340px; border-radius: 20px; overflow: hidden; margin-bottom: 4px;
    background: linear-gradient(#ffe9d6 0 58%, #d9a877 58% 100%); border: 2px solid var(--line); }
  #room::before { content: '🪟'; position: absolute; top: 18px; left: 24px; font-size: 54px; opacity: .9; }
  #room::after { content: '🪴'; position: absolute; top: 96px; right: 18px; font-size: 44px; }
  #room .rug { position: absolute; left: 50%; bottom: 20px; width: 70%; height: 60px; transform: translateX(-50%);
    border-radius: 50%; background: #c86b5a; opacity: .5; }
  #room .emptyRoom { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #7a5a44; padding: 20px; font-weight: 600; }
  .roomCat { position: absolute; width: 64px; text-align: center; transition: left 2.5s ease-in-out, top 2.5s ease-in-out; cursor: pointer; z-index: 2; }
  .roomCat img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.25); animation: bob 1.8s ease-in-out infinite; }
  .roomCat .bubble { position: absolute; top: -14px; right: -6px; font-size: 20px; }
  .roomCat .nm { font-size: 11px; font-weight: 700; color: #4a3326; background: rgba(255,255,255,.8); border-radius: 8px; padding: 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .careRow { display: flex; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 10px; margin-top: 10px; cursor: pointer; }
  .careRow img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; }
  .careRow .grow { flex: 1; min-width: 0; }
  .careRow .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 3px; }
  .meter .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 99px; transition: width .4s; }
  .hearts { font-size: 13px; letter-spacing: 1px; }
  .careHero { position: relative; width: 200px; height: 200px; margin: 4px auto 10px; }
  .careHero img.pic { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 5px solid var(--line); }
  .careHero.jump img.pic { animation: jump .5s ease; }
  @keyframes jump { 40% { transform: translateY(-24px) scale(1.05); } }
  .careBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .careBtns button { border: 0; border-radius: 16px; padding: 14px 4px; font-size: 15px; font-weight: 700; background: var(--bg);
    color: var(--ink); border: 2px solid var(--line); }
  .careBtns button span { display: block; font-size: 30px; }
  .floaty { position: fixed; z-index: 5000; font-size: 30px; pointer-events: none; animation: floaty 1.2s ease-out forwards; }
  @keyframes floaty { to { transform: translateY(-90px) scale(1.4); opacity: 0; } }
  #feather { position: absolute; font-size: 44px; cursor: pointer; transition: left .35s ease, top .35s ease; z-index: 3; }

  #toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%);
    z-index: 4000; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo"><img src="icon-192.png" alt="">KitCatGo</div>
  <div class="pill" id="yarnPill">🧶 <span id="yarnCount">0</span></div>
  <div class="pill" id="lvl"><div id="lvlNum">1</div><div id="xpbar"><div id="xpfill"></div></div></div>
</div>

<div class="view on" id="colView">
  <h2>My Cats</h2>
  <div class="sub" id="colSub"></div>
  <div id="grid"></div>
  <div id="empty"></div>
</div>

<div class="view" id="mapView">
  <div id="map"></div>
  <div id="mapBtns">
    <button class="roundBtn" id="walkBtn" title="Walk mode: tap the map to move">👣</button>
    <button class="roundBtn" id="centerBtn" title="Centre on me">📍</button>
  </div>
</div>

<div class="view" id="homeView">
  <h2>Cat Home</h2>
  <div class="sub" id="homeSub"></div>
  <div id="room"></div>
  <button class="btn" id="feedAll">🐟 Feed everyone</button>
  <div id="careList"></div>
</div>

<div class="view" id="dexView">
  <h2>Catdex</h2>
  <div class="sub" id="dexSub"></div>
  <div id="dexGrid"></div>
</div>

<button id="spotBtn">📷 Spot a cat!</button>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<nav id="nav">
  <button data-tab="col" class="on"><span>🖼️</span>My Cats</button>
  <button data-tab="map"><span>🗺️</span>Map</button>
  <button data-tab="home"><span>🏠</span>Cat Home</button>
  <button data-tab="dex"><span>📖</span>Catdex</button>
</nav>

<!-- Add cat sheet -->
<div class="sheet" id="addSheet"><div class="sheetBox">
  <img class="big" id="addImg" alt="">
  <label class="lbl" for="addName">Name</label>
  <div class="row">
    <input class="field" id="addName" placeholder="What's this cat called?" maxlength="40">
    <button class="smallBtn" id="dice" title="Random name">🎲</button>
  </div>
  <label class="lbl">Coat or breed <small style="font-weight:400;color:var(--muted)">(not sure? pick the closest colour)</small></label>
  <div class="chips" id="coatChips"></div>
  <label class="lbl" for="addNote">Notes</label>
  <textarea class="field" id="addNote" rows="2" placeholder="Where was it? Was it friendly?"></textarea>
  <div class="meta" id="addLoc">📍 Getting location…</div>
  <button class="btn" id="saveBtn">Add to collection ✨</button>
  <button class="btn ghost" id="cancelBtn">Cancel</button>
</div></div>

<!-- Care sheet -->
<div class="sheet" id="careSheet"><div class="sheetBox" id="careBox"></div></div>

<!-- Cat detail sheet -->
<div class="sheet" id="detailSheet"><div class="sheetBox" id="detailBox"></div></div>

<div id="catch">
  <div id="catchTop">
    <button id="runBtn">🏃 Run</button>
    <div><div id="catchName"></div><div id="catchRarity"></div></div>
    <div class="pill">🧶 <span id="yarnLeft"></span></div>
  </div>
  <div id="arena">
    <div id="target"><div id="ringOuter"></div><div id="ring"></div><div id="targetArt"></div></div>
    <div id="ball">🧶</div>
    <div id="hint">Swipe the yarn up at the cat! Throw when the ring is small for a bonus.</div>
  </div>
</div>

<div id="yay"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Coat types & breeds (the Catdex) ----------
const RARITY = {
  common: 'var(--common)', uncommon: 'var(--uncommon)', rare: 'var(--rare)', epic: 'var(--epic)', legendary: 'var(--legendary)'
};
const COATS = [
  { id: 'ginger',   name: 'Ginger',        r: 'common',    fur: '#f4a259', acc: '#c9702c', pat: 'tabby',   eye: '#7cb342' },
  { id: 'black',    name: 'Black',         r: 'common',    fur: '#232323', acc: '#232323', pat: 'plain',   eye: '#ffca28' },
  { id: 'tabby',    name: 'Tabby',         r: 'common',    fur: '#a47148', acc: '#5d3a1a', pat: 'tabby',   eye: '#aed581' },
  { id: 'grey',     name: 'Grey',          r: 'common',    fur: '#9e9e9e', acc: '#757575', pat: 'plain',   eye: '#fbc02d' },
  { id: 'tuxedo',   name: 'Tuxedo',        r: 'common',    fur: '#2b2b2b', acc: '#ffffff', pat: 'tuxedo',  eye: '#fdd835' },
  { id: 'white',    name: 'White',         r: 'uncommon',  fur: '#ffffff', acc: '#e0e0e0', pat: 'plain',   eye: '#42a5f5' },
  { id: 'calico',   name: 'Calico',        r: 'uncommon',  fur: '#fafafa', acc: '#e07b39', pat: 'patches', eye: '#8bc34a' },
  { id: 'tortie',   name: 'Tortoiseshell', r: 'uncommon',  fur: '#3e2723', acc: '#d9822b', pat: 'spots',   eye: '#ffb300' },
  { id: 'point',    name: 'Siamese-y',     r: 'rare',      fur: '#f3e5d0', acc: '#5d4037', pat: 'points',  eye: '#29b6f6' },
  { id: 'fluffy',   name: 'Super Fluffy',  r: 'rare',      fur: '#d7ccc8', acc: '#a1887f', pat: 'fluff',   eye: '#ff9800' },
  { id: 'spotty',   name: 'Spotty',        r: 'epic',      fur: '#e6b35c', acc: '#5d3a1a', pat: 'spots',   eye: '#9ccc65' },
  { id: 'mystery',  name: 'Mystery',       r: 'legendary', fur: '#3a1c71', acc: '#f5d0ff', pat: 'spots',   eye: '#ffe082' },
  // Breeds
  { id: 'british',    name: 'British Shorthair',  r: 'uncommon' },
  { id: 'persian',    name: 'Persian',            r: 'uncommon' },
  { id: 'ragdoll',    name: 'Ragdoll',            r: 'uncommon' },
  { id: 'russian',    name: 'Russian Blue',       r: 'uncommon' },
  { id: 'burmese',    name: 'Burmese',            r: 'uncommon' },
  { id: 'american',   name: 'American Shorthair', r: 'uncommon' },
  { id: 'exotic',     name: 'Exotic Shorthair',   r: 'uncommon' },
  { id: 'bombay',     name: 'Bombay',             r: 'uncommon' },
  { id: 'chartreux',  name: 'Chartreux',          r: 'uncommon' },
  { id: 'himalayan',  name: 'Himalayan',          r: 'uncommon' },
  { id: 'birman',     name: 'Birman',             r: 'uncommon' },
  { id: 'norwegian',  name: 'Norwegian Forest',   r: 'uncommon' },
  { id: 'siberian',   name: 'Siberian',           r: 'uncommon' },
  { id: 'fold',       name: 'Scottish Fold',      r: 'rare' },
  { id: 'abyssinian', name: 'Abyssinian',         r: 'rare' },
  { id: 'devon',      name: 'Devon Rex',          r: 'rare' },
  { id: 'cornish',    name: 'Cornish Rex',        r: 'rare' },

// ---------- Storage (IndexedDB keeps photos on this device) ----------
let db, cats = [];
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('kitcatgo', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('cats', { keyPath: 'id' });
    req.onsuccess = () => { db = req.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
function tx(mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction('cats', mode), store = t.objectStore('cats');
    const r = fn(store);
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
  });
}
const loadAll = () => tx('readonly', s => s.getAll());
const putCat = c => tx('readwrite', s => s.put(c));
const delCat = id => tx('readwrite', s => s.delete(id));

// ---------- XP & levels ----------
const XP_CARE = 5, XP_NEW_CAT = 100, XP_WILD_CAT = 50, XP_NEW_COAT = 300, XP_SEEN_AGAIN = 25;
const levelOf = xp => Math.floor(Math.sqrt(xp / 250)) + 1;
const xpFor = lvl => (lvl - 1) ** 2 * 250;
function totalXP() {
  const coats = new Set(cats.map(c => c.coat));
  return cats.reduce((s, c) => s + (c.wild ? XP_WILD_CAT : XP_NEW_CAT) + (c.seen - 1) * XP_SEEN_AGAIN + (c.love || 0) * XP_CARE, 0) + coats.size * XP_NEW_COAT;
}
function renderHUD() {
  const xp = totalXP(), lvl = levelOf(xp), lo = xpFor(lvl), hi = xpFor(lvl + 1);
  document.getElementById('lvlNum').textContent = lvl;
  document.getElementById('xpfill').style.width = ((xp - lo) / (hi - lo) * 100) + '%';
}

function toast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}

camera.onchange = async () => {
  const file = camera.files[0]; if (!file) return;
  try {
    const photo = await shrink(file, 1080, 0.82);
    const thumb = await shrink(file, 240, 0.75);
    openAdd(photo, thumb);
  } catch (e) { toast("Couldn't read that photo 😿"); }
};
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ---------- Map ----------
let map = null, pinLayer = null, meMarker = null, rangeCircle = null, me = null, followMe = true;
let walkMode = false, gpsWatch = null;
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([51.5074, -0.1278], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  map.on('click', e => { if (walkMode) { followMe = false; setMe(e.latlng.lat, e.latlng.lng); } });
  map.on('dragstart', () => followMe = false);
  startGPS();
}
function renderMap() {
  if (!map) return;
  pinLayer.clearLayers();
  cats.filter(c => c.lat != null && !c.wild).forEach(c => {
    L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', iconSize: [48, 48], iconAnchor: [24, 24],
      html: `<div class="pin" style="background-image:url(${c.thumb});border-color:${getComputedStyle(document.documentElement).getPropertyValue('--' + coatById(c.coat).r)}"></div>` }) })
      .on('click', () => openDetail(c.id)).addTo(pinLayer);
  });
}
function setMe(lat, lng) {
  me = [lat, lng];
  if (!meMarker) {
    meMarker = L.marker(me, { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
    rangeCircle = L.circle(me, { radius: CATCH_RANGE, color: '#ff8a5c', weight: 1, fillOpacity: .08, interactive: false }).addTo(map);
    map.setView(me, 17);
  } else {
    meMarker.setLatLng(me); rangeCircle.setLatLng(me);
    if (followMe) map.panTo(me);
  }
  refreshSpawns();
}
function startGPS() {
  if (!navigator.geolocation) { noGPS(); return; }
  gpsWatch = navigator.geolocation.watchPosition(
    p => { if (!walkMode) setMe(p.coords.latitude, p.coords.longitude); },
    () => noGPS(),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function stopGPS() { if (gpsWatch !== null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
function noGPS() {
  if (walkMode) return;
  setWalk(true, true);
  if (!me) setMe(51.5074, -0.1278);
  toast("Couldn't get your location, so Walk mode is on. Tap the map to move!", 4000);
}
const walkBtn = document.getElementById('walkBtn');
function setWalk(on, quiet) {
  walkMode = on; walkBtn.classList.toggle('on', on);
  if (on) { stopGPS(); if (!quiet) toast('Walk mode on: tap the map to move 👣'); }
  else { followMe = true; startGPS(); if (!quiet) toast('Using your real location 📍'); }
}
walkBtn.onclick = () => setWalk(!walkMode);
document.getElementById('centerBtn').onclick = () => { followMe = true; if (me) map.setView(me, 17); };

// ---------- Wild cats ----------
const WILD = {
  common:    { w: 50, catch: .80, flee: .08 },
  uncommon:  { w: 28, catch: .60, flee: .12 },
  rare:      { w: 14, catch: .45, flee: .18 },
  epic:      { w: 6,  catch: .30, flee: .24 },
  legendary: { w: 2,  catch: .15, flee: .30 },
};
const CATCH_RANGE = 70, SPAWN_COUNT = 8, SPAWN_LIFE = 10 * 60 * 1000;
let spawns = [];
function pickCoat() {
  const total = Object.values(WILD).reduce((t, r) => t + r.w, 0);
  let n = Math.random() * total, rarity = 'common';
  for (const [k, r] of Object.entries(WILD)) { if ((n -= r.w) < 0) { rarity = k; break; } }
  const pool = COATS.filter(c => c.r === rarity);
  return pool[Math.floor(Math.random() * pool.length)];
}
function offset(lat, lng, dist, bearing) {
  const R = 6378137, dLat = dist * Math.cos(bearing) / R, dLng = dist * Math.sin(bearing) / (R * Math.cos(lat * Math.PI / 180));
  return [lat + dLat * 180 / Math.PI, lng + dLng * 180 / Math.PI];
}
function wildIcon(coat, far) {
  return L.divIcon({ className: '', iconSize: [56, 56], iconAnchor: [28, 40],
    html: `<div class="wild ${far ? 'far' : ''}"><img src="cats/${coat.id}.jpg" alt="" style="border-color:${getComputedStyle(document.documentElement).getPropertyValue('--' + coat.r)}"></div>` });
}
function refreshSpawns() {
  if (!me || !map) return;
  const now = Date.now();
  spawns = spawns.filter(sp => {
    const keep = sp.expires > now && map.distance(me, sp.pos) < 400;
    if (!keep) map.removeLayer(sp.marker);
    return keep;
  });
  while (spawns.length < SPAWN_COUNT) {
    const coat = pickCoat();
    const pos = offset(me[0], me[1], 30 + Math.random() * 220, Math.random() * Math.PI * 2);
    const sp = { coat, pos, expires: now + SPAWN_LIFE * (0.5 + Math.random()) };
    sp.marker = L.marker(pos, { icon: wildIcon(coat, true) }).addTo(map).on('click', () => tryCatch(sp));
    spawns.push(sp);
  }
  spawns.forEach(sp => {
    const far = map.distance(me, sp.pos) > CATCH_RANGE;
    if (far !== sp.far) { sp.far = far; sp.marker.setIcon(wildIcon(sp.coat, far)); }
  });
}
setInterval(refreshSpawns, 15000);
function removeSpawn(sp) { map.removeLayer(sp.marker); spawns = spawns.filter(x => x !== sp); }
function tryCatch(sp) {
  if (!me) return;
  const d = Math.round(map.distance(me, sp.pos));
  if (d > CATCH_RANGE) { toast(`That ${sp.coat.name} cat is ${d}m away. Get closer! 🐾`); return; }
  openCatch(sp);
}

// ---------- Yarn ----------
const YARN_KEY = 'kitcatgo.yarn', MAX_YARN = 50, YARN_REGEN_MS = 60 * 1000;
let Y = { n: 30, at: Date.now() };
try { const v = JSON.parse(localStorage.getItem(YARN_KEY)); if (v) Y = v; } catch (e) {}
function saveYarn() { try { localStorage.setItem(YARN_KEY, JSON.stringify(Y)); } catch (e) {} }
function regenYarn() {
  const gained = Math.floor((Date.now() - Y.at) / YARN_REGEN_MS);
  if (gained > 0) { Y.n = Math.min(MAX_YARN, Y.n + gained); Y.at = Y.n >= MAX_YARN ? Date.now() : Y.at + gained * YARN_REGEN_MS; saveYarn(); }
  document.getElementById('yarnCount').textContent = Y.n;
  document.getElementById('yarnLeft').textContent = Y.n;
}
setInterval(regenYarn, 10000);

// ---------- Catch screen ----------
const catchEl = document.getElementById('catch'), ball = document.getElementById('ball'),
      ring = document.getElementById('ring'), target = document.getElementById('target');
let cur = null, ringT = 0, ringRAF = null, busy = false, start = null;
function openCatch(sp) {
  cur = sp; busy = false;
  document.getElementById('catchName').textContent = `Wild ${sp.coat.name} cat`;
  const rr = document.getElementById('catchRarity');
  rr.textContent = sp.coat.r; rr.style.color = RARITY[sp.coat.r];
  document.getElementById('targetArt').innerHTML = `<img src="cats/${sp.coat.id}.jpg" alt="">`;
  ring.style.borderColor = RARITY[sp.coat.r];
  target.style.visibility = 'visible';
  resetBall(); regenYarn();
  catchEl.classList.add('open');
  const loop = () => {
    ringT = (ringT + 0.012) % 1;
    ring.style.width = ring.style.height = (220 - ringT * 170) + 'px';
    ringRAF = requestAnimationFrame(loop);
  };
  cancelAnimationFrame(ringRAF); loop();
}
function closeCatch() { catchEl.classList.remove('open'); cancelAnimationFrame(ringRAF); cur = null; }
document.getElementById('runBtn').onclick = closeCatch;
function resetBall() {
  ball.style.transition = 'none'; ball.style.transform = 'none';
  ball.style.opacity = Y.n > 0 ? 1 : .3; ball.classList.remove('wobble');
}
ball.addEventListener('pointerdown', e => { if (!busy) start = { x: e.clientX, y: e.clientY, t: Date.now() }; });
window.addEventListener('pointerup', e => {
  if (!start || !cur) return;
  const dy = start.y - e.clientY, dx = e.clientX - start.x, dt = Date.now() - start.t;
  start = null;
  if (dy < 40 || dt > 900) return;
  if (Y.n <= 0) { toast('Out of yarn! You get 1 back every minute 🧶'); return; }
  throwBall(dx / dy);
});
function throwBall(curve) {
  busy = true;
  if (Y.n >= MAX_YARN) Y.at = Date.now();
  Y.n--; saveYarn(); regenYarn();
  const ringSize = 220 - ringT * 170;
  const bonus = 1 + (1 - (ringSize - 50) / 170) * 0.5;
  const accurate = Math.abs(curve) < 0.35;
  const tRect = target.getBoundingClientRect(), bRect = ball.getBoundingClientRect();
  const tx = (tRect.left + tRect.width / 2) - (bRect.left + bRect.width / 2) + (accurate ? 0 : curve * 120);
  const ty = (tRect.top + tRect.height / 2) - (bRect.top + bRect.height / 2);
  ball.style.transition = 'transform .6s cubic-bezier(.3,.6,.4,1)';
  ball.style.transform = `translate(${tx}px, ${ty}px) scale(.55) rotate(540deg)`;
  setTimeout(() => {
    if (!accurate) { toast('Missed! Swipe straight up 🎯'); busy = false; resetBall(); return; }
    const caught = Math.random() < Math.min(0.97, WILD[cur.coat.r].catch * bonus);
    if (ringSize < 100) toast(ringSize < 70 ? 'Purrfect throw! ⭐' : 'Great throw!');
    target.style.visibility = 'hidden';
    const wobbles = caught ? 3 : 1 + Math.floor(Math.random() * 2);
    let w = 0;
    const doWobble = () => {
      ball.classList.remove('wobble'); void ball.offsetWidth; ball.classList.add('wobble');
      if (++w < wobbles) setTimeout(doWobble, 700); else setTimeout(() => finishThrow(caught), 700);
    };
    doWobble();
  }, 620);
}
async function finishThrow(caught) {
  target.style.visibility = 'visible';
  if (!caught) {
    if (Math.random() < WILD[cur.coat.r].flee) {
      toast(`Oh no! The ${cur.coat.name} cat ran away 💨`, 3000);
      removeSpawn(cur); closeCatch();
    } else {
      target.classList.remove('dodge'); void target.offsetWidth; target.classList.add('dodge');
      toast('It broke free! Try again'); busy = false; resetBall();
    }
    return;
  }
  const coat = cur.coat, coatIsNew = !cats.some(c => c.coat === coat.id), lvlBefore = levelOf(totalXP());
  const cat = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: randomName(), note: '', coat: coat.id, wild: true,
    photo: `cats/${coat.id}.jpg`, thumb: `cats/${coat.id}.jpg`,
    power: Math.floor(10 + Math.random() * 90 * (1 + Object.keys(WILD).indexOf(coat.r))),
    lat: cur.pos[0], lng: cur.pos[1], date: Date.now(), seen: 1,
  };
  try { await putCat(cat); } catch (e) { toast('Could not save that cat 😿'); }
  cats.push(cat);
  const bonusYarn = 1 + Math.floor(Math.random() * 3);
  Y.n = Math.min(MAX_YARN, Y.n + bonusYarn); saveYarn(); regenYarn();
  removeSpawn(cur); closeCatch(); renderAll();
  const lvlAfter = levelOf(totalXP());
  celebrate(cat, [
    `${coat.name} · ⚡ Purr Power ${cat.power}`,
    `+${XP_WILD_CAT + (coatIsNew ? XP_NEW_COAT : 0)} XP · +${bonusYarn} 🧶`,
    coatIsNew ? `🆕 New Catdex entry: ${coat.name}!` : '',
    lvlAfter > lvlBefore ? `🎉 Level up! You're level ${lvlAfter}` : '',
  ]);
}

// ---------- Cat Home: feed, play, pet ----------
const DECAY_PER_HOUR = 4;          // meters drop from 100 to 0 in about a day
const clamp = v => Math.max(0, Math.min(100, v));
function stat(c, key) {           // key: 'full' or 'joy'
  const v = c[key] ?? 70, at = c[key + 'At'] ?? c.date;
  return clamp(v - (Date.now() - at) / 3600000 * DECAY_PER_HOUR);
}
function bump(c, key, amt) { c[key] = clamp(stat(c, key) + amt); c[key + 'At'] = Date.now(); }
const heartsOf = c => Math.min(5, Math.floor((c.love || 0) / 10));
const heartStr = c => '❤️'.repeat(heartsOf(c)) + '🤍'.repeat(5 - heartsOf(c));
function mood(c) {
  const f = stat(c, 'full'), j = stat(c, 'joy');
  if (f < 30) return { e: '🍽️', t: 'Hungry!' };
  if (j < 30) return { e: '🥺', t: 'Wants to play' };
  if (f > 70 && j > 70) return { e: '💖', t: 'So happy' };
  return { e: '', t: 'Content' };
}
function meterHTML(label, v, color) {
  return `<div class="meter">${label}<div class="bar"><div class="fill" style="width:${v}%;background:${color}"></div></div></div>`;
}
function floaty(emoji, el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    const f = document.createElement('div');
    f.className = 'floaty'; f.textContent = emoji;
    f.style.left = (r.left + r.width / 2 - 15 + (i - 1) * 28) + 'px';
    f.style.top = (r.top + r.height / 3) + 'px';
    f.style.animationDelay = (i * 0.12) + 's';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1600);
  }
}
async function care(c, key, amt, emoji, el, msg) {
  const before = stat(c, key);
  const lvlBefore = levelOf(totalXP()), heartsBefore = heartsOf(c);
  bump(c, key, amt);
  if (before < 95) c.love = (c.love || 0) + 1;   // no love points for spamming a full cat
  await putCat(c);
  if (el) floaty(emoji, el);
  if (heartsOf(c) > heartsBefore) toast(`💖 ${c.name} loves you more! (${heartsOf(c)}/5 hearts)`, 3000);
  else if (before >= 95) toast(`${c.name} is already ${key === 'full' ? 'full' : 'super happy'}! 😸`);
  else if (msg) toast(msg);
  if (levelOf(totalXP()) > lvlBefore) toast(`🎉 Level up! You're level ${levelOf(totalXP())}`, 3000);
  renderHUD(); renderHome();
}

let roomTimer = null;
function renderHome() {
  const room = document.getElementById('room');
  const list = cats.slice().sort((a, b) => (stat(a, 'full') + stat(a, 'joy')) - (stat(b, 'full') + stat(b, 'joy')));
  const hungry = cats.filter(c => stat(c, 'full') < 30).length;
  document.getElementById('homeSub').textContent = !cats.length ? '' :
    hungry ? `🍽️ ${hungry} hungry cat${hungry === 1 ? '' : 's'}! Tap a cat to look after it.` : '😸 Everyone is happy. Tap a cat to play!';
  document.getElementById('feedAll').style.display = cats.length ? '' : 'none';
  if (!cats.length) {
    room.innerHTML = `<div class="rug"></div><div class="emptyRoom">Your cat home is empty!<br>Snap a photo 📷 or catch wild cats 🗺️ and they'll move in here.</div>`;
  } else {
    const shown = cats.slice(-12);
    const existing = new Set([...room.querySelectorAll('.roomCat')].map(e => e.dataset.id));
    const same = shown.length === existing.size && shown.every(c => existing.has(c.id));
    if (!same) room.innerHTML = '<div class="rug"></div>' + shown.map(c =>
      `<div class="roomCat" data-id="${c.id}" data-slot="${shown.indexOf(c)}" style="${slotPos(shown.indexOf(c))}">
        <span class="bubble"></span><img src="${c.thumb}" alt=""><div class="nm">${esc(c.name)}</div></div>`).join('');
    shown.forEach(c => { const b = room.querySelector(`.roomCat[data-id="${c.id}"] .bubble`); if (b) b.textContent = mood(c).e; });
  }
  document.getElementById('careList').innerHTML = list.map(c => `
    <div class="careRow" data-id="${c.id}"><img src="${c.thumb}" alt="">
      <div class="grow"><div class="nm">${esc(c.name)} ${mood(c).e}</div>
        ${meterHTML('🐟', stat(c, 'full'), '#ff8a5c')}${meterHTML('😺', stat(c, 'joy'), '#a45cf0')}
        <div class="hearts">${heartStr(c)}</div></div></div>`).join('');
}
// Each cat gets its own spot (4 per row, bottom row first) and wiggles around it
function slotPos(i, jitter = 0) {
  const col = i % 4, row = Math.floor(i / 4);
  const left = 4 + col * 24 + (Math.random() - .5) * jitter, top = [66, 42, 18][row] + (Math.random() - .5) * jitter;
  return `left:${left}%;top:${top}%`;
}
function wanderRoom() {
  document.querySelectorAll('#room .roomCat').forEach(el => {
    if (Math.random() < 0.5) el.style.cssText = slotPos(+el.dataset.slot, 8);
  });
}
document.getElementById('room').onclick = e => { const el = e.target.closest('.roomCat'); if (el) openCare(el.dataset.id); };
document.getElementById('careList').onclick = e => { const el = e.target.closest('.careRow'); if (el) openCare(el.dataset.id); };
document.getElementById('feedAll').onclick = async e => {
  let n = 0;
  for (const c of cats) { const before = stat(c, 'full'); bump(c, 'full', 40); if (before < 95) { c.love = (c.love || 0) + 1; n++; } await putCat(c); }
  floaty('🐟', e.currentTarget);
  toast(n ? `Fed ${n} cat${n === 1 ? '' : 's'}! Om nom nom 🐟` : 'Everyone is already full! 😸');
  renderHUD(); renderHome();
};

let careCat = null;
function openCare(id) {
  const c = cats.find(x => x.id === id); if (!c) return;
  careCat = c;
  const box = document.getElementById('careBox');
  const draw = () => {
    const m = mood(c);
    box.innerHTML = `
      <div class="careHero" id="careHero"><img class="pic" src="${c.thumb}" alt=""></div>
      <h2 style="text-align:center;margin:0">${esc(c.name)}</h2>
      <div style="text-align:center" class="meta">${coatById(c.coat).name} · ${m.t} ${m.e}</div>
      <div style="text-align:center;font-size:20px;margin:6px 0">${heartStr(c)}</div>
      ${meterHTML('🐟 Food', stat(c, 'full'), '#ff8a5c')}
      ${meterHTML('😺 Fun', stat(c, 'joy'), '#a45cf0')}
      <div class="careBtns">
        <button id="cFeed"><span>🐟</span>Feed</button>
        <button id="cPlay"><span>🪶</span>Play</button>
        <button id="cPet"><span>✋</span>Pet</button>
      </div>
      <button class="btn ghost" id="cClose">Done</button>`;
    const hero = document.getElementById('careHero');
    document.getElementById('cFeed').onclick = async () => {
      const food = ['🐟', '🍗', '🥛', '🍤'][Math.floor(Math.random() * 4)];
      await care(c, 'full', 35, food, hero, `${c.name} munched it up! ${food}`); draw();
    };
    document.getElementById('cPet').onclick = async () => {
      hero.classList.remove('jump'); void hero.offsetWidth; hero.classList.add('jump');
      await care(c, 'joy', 15, '💕', hero, `Purrrrr... ${c.name} loves that 💕`); draw();
    };
    document.getElementById('cPlay').onclick = () => playGame(c, hero, draw);
    document.getElementById('cClose').onclick = closeCare;
  };
  draw();
  document.getElementById('careSheet').classList.add('open');
}
function closeCare() { document.getElementById('careSheet').classList.remove('open'); careCat = null; }

// Play: tap the feather 3 times before it gets away
function playGame(c, hero, done) {
  let hits = 0, left = 8;
  const f = document.createElement('div');
  f.id = 'feather'; f.textContent = '🪶';
  hero.appendChild(f);
  const move = () => { f.style.left = (Math.random() * 150) + 'px'; f.style.top = (Math.random() * 150) + 'px'; };
  move();
  toast(`Tap the feather 3 times! 🪶`, 1800);
  const timer = setInterval(() => { if (--left <= 0) finish(false); else move(); }, 900);
  f.onclick = e => {
    e.stopPropagation(); hits++;
    hero.classList.remove('jump'); void hero.offsetWidth; hero.classList.add('jump');
    if (hits >= 3) finish(true); else move();
  };
  async function finish(won) {
    clearInterval(timer); f.remove();
    if (won) await care(c, 'joy', 35, '🧶', hero, `${c.name} caught the feather! So much fun 🎉`);
    else { await care(c, 'joy', 10, '🪶', hero, `The feather got away! ${c.name} still had fun`); }
    done();
  }
}

// ---------- Tabs ----------
function showTab(t) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === t + 'View'));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.body.classList.toggle('onMap', t === 'map');
  clearInterval(roomTimer);
  if (t === 'home') { renderHome(); roomTimer = setInterval(() => { wanderRoom(); renderHome(); }, 3000); }
  if (t === 'map') { if (!map) initMap(); map.invalidateSize(); renderMap(); regenYarn(); }
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function renderAll() { renderHUD(); renderCollection(); renderDex(); renderMap(); renderHome(); }

// ---------- Go! ----------
regenYarn();
openDB().then(loadAll).then(all => { cats = all || []; renderAll(); })
  .catch(() => { renderAll(); toast("Can't save photos in this browser (private mode?)", 4000); });
</script>
