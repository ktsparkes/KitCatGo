<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff8a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KitCatGo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7f0; --card: #ffffff; --ink: #3b2a22; --muted: #8a7468;
    --brand: #ff8a5c; --brand-dark: #e5673a; --line: #f0e0d4;
    --common: #9aa5b1; --uncommon: #4caf7a; --rare: #3d8bfd; --epic: #a45cf0; --legendary: #f5b400;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1714; --card: #2a221e; --ink: #f6ebe4; --muted: #b59e92; --line: #3d322c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Fredoka', system-ui, sans-serif; overflow: hidden; }
  button, input, textarea { font-family: inherit; font-size: 16px; }
  button { cursor: pointer; }

  /* Top bar */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center;
    gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); }
  #logo { font-weight: 700; font-size: 20px; color: var(--brand-dark); }
  .pill { background: var(--card); border-radius: 999px; padding: 6px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #lvl { flex: 1; max-width: 220px; margin-left: auto; }
  #lvlNum { background: var(--brand); color: #fff; border-radius: 999px; min-width: 28px; height: 28px;
    display: grid; place-items: center; font-size: 14px; }
  #xpbar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #xpfill { height: 100%; width: 0; background: var(--brand); transition: width .4s; }

  /* Views */
  .view { position: fixed; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top));
    bottom: calc(64px + env(safe-area-inset-bottom)); overflow-y: auto; padding: 8px 16px 110px; display: none; }
  .view.on { display: block; }
  #mapView { padding: 0; }
  #map { position: absolute; inset: 0; background: #e8e0d8; }
  h2 { margin: 6px 0 2px; }
  .sub { color: var(--muted); margin-bottom: 14px; }

  /* Collection grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .photoCard { background: var(--card); border-radius: 16px; overflow: hidden; border: 2px solid var(--line); cursor: pointer; }
  .photoCard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .photoCard .info { padding: 6px 10px 8px; }
  .photoCard .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photoCard small { color: var(--muted); }
  #empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  #empty svg { width: 120px; height: 120px; }

  /* Catdex */
  #dexGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .dexCard { background: var(--card); border-radius: 16px; padding: 8px 6px 10px; text-align: center;
    border: 2px solid var(--line); position: relative; }
  .dexCard svg { width: 60px; height: 60px; }
  .dexCard .nm { font-size: 13px; font-weight: 600; line-height: 1.1; }
  .dexCard .ct { position: absolute; top: 4px; right: 8px; font-size: 12px; font-weight: 700; color: var(--brand-dark); }
  .dexCard.unseen svg { filter: brightness(0) opacity(.2); }
  .dexCard.unseen .nm { color: var(--muted); }

  /* Spot button */
  #spotBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom));
    z-index: 1100; background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 14px 26px;
    font-size: 19px; font-weight: 700; box-shadow: 0 6px 20px rgba(229,103,58,.45); white-space: nowrap; }
  #spotBtn:active { transform: translateX(-50%) scale(.96); }

  /* Bottom nav */
  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); background: var(--card); display: flex; z-index: 1000;
    border-top: 1px solid var(--line); }
  #nav button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #nav button span { font-size: 22px; }
  #nav button.on { color: var(--brand-dark); }

  /* Map pins */
  .pin { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background-size: cover;
    background-position: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(255,138,92,.25); }

  /* Sheets / modals */
  .sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.5); display: none;
    align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .sheetBox { background: var(--card); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheetBox img.big { width: 100%; max-height: 45vh; object-fit: cover; border-radius: 16px; display: block; }
  label.lbl { display: block; font-weight: 700; margin: 14px 0 6px; }
  .field { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip { background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px 2px 6px;
    text-align: center; font-size: 11px; font-weight: 600; color: var(--ink); }
  .chip svg { width: 38px; height: 38px; display: block; margin: 0 auto; }
  .chip.on { border-color: var(--brand); background: rgba(255,138,92,.15); }
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 13px 24px;
    font-size: 17px; font-weight: 700; width: 100%; margin-top: 16px; }
  .btn.ghost { background: var(--bg); color: var(--ink); border: 2px solid var(--line); }
  .btn.danger { background: none; color: #d64545; margin-top: 8px; }
  .smallBtn { border: 0; background: var(--line); color: var(--ink); border-radius: 10px; padding: 12px; white-space: nowrap; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; }
  .meta { color: var(--muted); margin: 4px 0; }

  /* Celebration */
  #yay { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.6); display: none; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center; padding: 24px; }
  #yay.open { display: flex; }
  #yay .big { font-size: 38px; font-weight: 700; animation: pop .5s ease; }
  #yay img { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 6px solid #fff; margin: 16px 0; animation: pop .5s ease; }
  #yay .btn { max-width: 260px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

  #toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%);
    z-index: 4000; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">🐱 KitCatGo</div>
  <div class="pill" id="lvl"><div id="lvlNum">1</div><div id="xpbar"><div id="xpfill"></div></div></div>
</div>

<div class="view on" id="colView">
  <h2>My Cats</h2>
  <div class="sub" id="colSub"></div>
  <div id="grid"></div>
  <div id="empty"></div>
</div>

<div class="view" id="mapView"><div id="map"></div></div>

<div class="view" id="dexView">
  <h2>Catdex</h2>
  <div class="sub" id="dexSub"></div>
  <div id="dexGrid"></div>
</div>

<button id="spotBtn">📷 Spot a cat!</button>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<nav id="nav">
  <button data-tab="col" class="on"><span>🖼️</span>My Cats</button>
  <button data-tab="map"><span>🗺️</span>Map</button>
  <button data-tab="dex"><span>📖</span>Catdex</button>
</nav>

<!-- Add cat sheet -->
<div class="sheet" id="addSheet"><div class="sheetBox">
  <img class="big" id="addImg" alt="">
  <label class="lbl" for="addName">Name</label>
  <div class="row">
    <input class="field" id="addName" placeholder="What's this cat called?" maxlength="40">
    <button class="smallBtn" id="dice" title="Random name">🎲</button>
  </div>
  <label class="lbl">Coat type</label>
  <div class="chips" id="coatChips"></div>
  <label class="lbl" for="addNote">Notes</label>
  <textarea class="field" id="addNote" rows="2" placeholder="Where was it? Was it friendly?"></textarea>
  <div class="meta" id="addLoc">📍 Getting location…</div>
  <button class="btn" id="saveBtn">Add to collection ✨</button>
  <button class="btn ghost" id="cancelBtn">Cancel</button>
</div></div>

<!-- Cat detail sheet -->
<div class="sheet" id="detailSheet"><div class="sheetBox" id="detailBox"></div></div>

<div id="yay"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Coat types (the Catdex) ----------
const RARITY = {
  common: 'var(--common)', uncommon: 'var(--uncommon)', rare: 'var(--rare)', epic: 'var(--epic)', legendary: 'var(--legendary)'
};
const COATS = [
  { id: 'ginger',   name: 'Ginger',        r: 'common',    fur: '#f4a259', acc: '#c9702c', pat: 'tabby',   eye: '#7cb342' },
  { id: 'black',    name: 'Black',         r: 'common',    fur: '#232323', acc: '#232323', pat: 'plain',   eye: '#ffca28' },
  { id: 'tabby',    name: 'Tabby',         r: 'common',    fur: '#a47148', acc: '#5d3a1a', pat: 'tabby',   eye: '#aed581' },
  { id: 'grey',     name: 'Grey',          r: 'common',    fur: '#9e9e9e', acc: '#757575', pat: 'plain',   eye: '#fbc02d' },
  { id: 'tuxedo',   name: 'Tuxedo',        r: 'common',    fur: '#2b2b2b', acc: '#ffffff', pat: 'tuxedo',  eye: '#fdd835' },
  { id: 'white',    name: 'White',         r: 'uncommon',  fur: '#ffffff', acc: '#e0e0e0', pat: 'plain',   eye: '#42a5f5' },
  { id: 'calico',   name: 'Calico',        r: 'uncommon',  fur: '#fafafa', acc: '#e07b39', pat: 'patches', eye: '#8bc34a' },
  { id: 'tortie',   name: 'Tortoiseshell', r: 'uncommon',  fur: '#3e2723', acc: '#d9822b', pat: 'spots',   eye: '#ffb300' },
  { id: 'point',    name: 'Siamese-y',     r: 'rare',      fur: '#f3e5d0', acc: '#5d4037', pat: 'points',  eye: '#29b6f6' },
  { id: 'fluffy',   name: 'Super Fluffy',  r: 'rare',      fur: '#d7ccc8', acc: '#a1887f', pat: 'fluff',   eye: '#ff9800' },
  { id: 'spotty',   name: 'Spotty',        r: 'epic',      fur: '#e6b35c', acc: '#5d3a1a', pat: 'spots',   eye: '#9ccc65' },
  { id: 'mystery',  name: 'Mystery',       r: 'legendary', fur: '#3a1c71', acc: '#f5d0ff', pat: 'spots',   eye: '#ffe082' },
];
const coatById = id => COATS.find(c => c.id === id) || COATS[COATS.length - 1];
const NAMES = ['Mochi','Biscuit','Luna','Pickle','Noodle','Pumpkin','Waffles','Tofu','Muffin','Ziggy','Pepper','Olive',
  'Beans','Nacho','Bramble','Sprout','Maple','Toast','Pip','Clementine','Socks','Marmalade','Sushi','Button','Dumpling',
  'Sir Fluffington','Captain Whiskers','Duchess','Meatball','Crumpet','Pudding','Gizmo','Smudge','Tigger','Bagel'];

function catSVG(c, cls = '') {
  const f = c.fur, a = c.acc;
  let pat = '';
  if (c.pat === 'tabby') pat = `<path d="M42 26 L44 38 M50 24 L50 38 M58 26 L56 38" stroke="${a}" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M14 56 L26 58 M14 66 L26 64 M86 56 L74 58 M86 66 L74 64" stroke="${a}" stroke-width="3" stroke-linecap="round"/>`;
  if (c.pat === 'patches') pat = `<path d="M20 40 Q30 26 46 30 Q44 46 26 52 Z" fill="${a}"/><path d="M60 28 Q76 28 82 46 Q70 46 62 40 Z" fill="#3b3b3b"/>`;
  if (c.pat === 'spots') pat = [[30,42,5],[68,40,6],[26,62,4],[74,64,5],[50,30,4],[40,78,3],[62,80,3]]
      .map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${a}"/>`).join('');
  if (c.pat === 'points') pat = `<ellipse cx="50" cy="68" rx="22" ry="17" fill="${a}" opacity=".85"/>`;
  if (c.pat === 'tuxedo') pat = `<path d="M50 44 Q34 56 34 74 Q50 90 66 74 Q66 56 50 44 Z" fill="${a}"/>`;
  const fluff = c.pat === 'fluff'
    ? `<path d="M12 60 Q4 70 14 78 Q10 90 26 90 Q36 98 50 94 Q64 98 74 90 Q90 90 86 78 Q96 70 88 60 Z" fill="${a}"/>` : '';
  const dark = c.pat === 'tuxedo' || c.fur === '#232323';
  return `<svg class="${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 42 L24 8 L46 28 Z" fill="${f}" stroke="${a}" stroke-width="1.5"/>
    <path d="M82 42 L76 8 L54 28 Z" fill="${f}" stroke="${a}" stroke-width="1.5"/>
    <path d="M24 34 L27 16 L39 28 Z" fill="#f8a5b3"/><path d="M76 34 L73 16 L61 28 Z" fill="#f8a5b3"/>
    ${fluff}
    <ellipse cx="50" cy="58" rx="38" ry="34" fill="${f}" stroke="${a}" stroke-width="1.5"/>
    ${pat}
    <ellipse cx="36" cy="54" rx="7" ry="8" fill="${c.eye}"/><ellipse cx="64" cy="54" rx="7" ry="8" fill="${c.eye}"/>
    <ellipse cx="36" cy="55" rx="2.5" ry="6" fill="#111"/><ellipse cx="64" cy="55" rx="2.5" ry="6" fill="#111"/>
    <circle cx="38" cy="51" r="1.8" fill="#fff"/><circle cx="66" cy="51" r="1.8" fill="#fff"/>
    <path d="M46 66 L54 66 L50 71 Z" fill="#f48fb1"/>
    <path d="M50 71 Q46 77 41 74 M50 71 Q54 77 59 74" stroke="${dark ? '#bbb' : '#5d4037'}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M30 68 L8 64 M30 72 L9 75 M70 68 L92 64 M70 72 L91 75" stroke="${dark ? '#ccc' : '#6d5a50'}" stroke-width="1" opacity=".7"/>
    ${c.id === 'mystery' ? '<text x="70" y="30" font-size="12">✨</text>' : ''}
  </svg>`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// ---------- Storage (IndexedDB keeps photos on this device) ----------
let db, cats = [];
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('kitcatgo', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('cats', { keyPath: 'id' });
    req.onsuccess = () => { db = req.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
function tx(mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction('cats', mode), store = t.objectStore('cats');
    const r = fn(store);
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
  });
}
const loadAll = () => tx('readonly', s => s.getAll());
const putCat = c => tx('readwrite', s => s.put(c));
const delCat = id => tx('readwrite', s => s.delete(id));

// ---------- XP & levels ----------
const XP_NEW_CAT = 100, XP_NEW_COAT = 300, XP_SEEN_AGAIN = 25;
const levelOf = xp => Math.floor(Math.sqrt(xp / 250)) + 1;
const xpFor = lvl => (lvl - 1) ** 2 * 250;
function totalXP() {
  const coats = new Set(cats.map(c => c.coat));
  return cats.reduce((s, c) => s + XP_NEW_CAT + (c.seen - 1) * XP_SEEN_AGAIN, 0) + coats.size * XP_NEW_COAT;
}
function renderHUD() {
  const xp = totalXP(), lvl = levelOf(xp), lo = xpFor(lvl), hi = xpFor(lvl + 1);
  document.getElementById('lvlNum').textContent = lvl;
  document.getElementById('xpfill').style.width = ((xp - lo) / (hi - lo) * 100) + '%';
}

function toast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- Photo capture ----------
const camera = document.getElementById('camera');
let draft = null;
document.getElementById('spotBtn').onclick = () => { camera.value = ''; camera.click(); };
camera.onchange = async () => {
  const file = camera.files[0]; if (!file) return;
  try {
    const photo = await shrink(file, 1080, 0.82);
    const thumb = await shrink(file, 240, 0.75);
    openAdd(photo, thumb);
  } catch (e) { toast("Couldn't read that photo 😿"); }
};
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = url;
  });
}

function randomName() { return NAMES[Math.floor(Math.random() * NAMES.length)]; }
function openAdd(photo, thumb) {
  draft = { photo, thumb, coat: null, lat: null, lng: null };
  document.getElementById('addImg').src = photo;
  document.getElementById('addName').value = '';
  document.getElementById('addNote').value = '';
  renderChips();
  const loc = document.getElementById('addLoc');
  loc.textContent = '📍 Getting location…';
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => { if (draft) { draft.lat = p.coords.latitude; draft.lng = p.coords.longitude; loc.textContent = '📍 Location saved'; } },
      () => { loc.textContent = '📍 No location (that\'s OK!)'; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  } else loc.textContent = '📍 No location (that\'s OK!)';
  document.getElementById('addSheet').classList.add('open');
}
function renderChips() {
  document.getElementById('coatChips').innerHTML = COATS.map(c =>
    `<button class="chip ${draft.coat === c.id ? 'on' : ''}" data-id="${c.id}">${catSVG(c)}${c.name}</button>`).join('');
}
document.getElementById('coatChips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  draft.coat = b.dataset.id; renderChips();
};
document.getElementById('dice').onclick = () => document.getElementById('addName').value = randomName();
document.getElementById('cancelBtn').onclick = () => { draft = null; document.getElementById('addSheet').classList.remove('open'); };

document.getElementById('saveBtn').onclick = async () => {
  if (!draft.coat) { toast('Pick a coat type first 🎨'); return; }
  const coatIsNew = !cats.some(c => c.coat === draft.coat);
  const lvlBefore = levelOf(totalXP());
  const cat = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: document.getElementById('addName').value.trim() || randomName(),
    note: document.getElementById('addNote').value.trim(),
    coat: draft.coat, photo: draft.photo, thumb: draft.thumb,
    lat: draft.lat, lng: draft.lng, date: Date.now(), seen: 1,
  };
  try { await putCat(cat); } catch (e) { toast('Could not save. Is your phone storage full?'); return; }
  cats.push(cat); draft = null;
  document.getElementById('addSheet').classList.remove('open');
  renderAll();
  const xp = XP_NEW_CAT + (coatIsNew ? XP_NEW_COAT : 0);
  const lvlAfter = levelOf(totalXP());
  celebrate(cat, [
    `+${xp} XP`,
    coatIsNew ? `🆕 New Catdex entry: ${coatById(cat.coat).name}!` : '',
    lvlAfter > lvlBefore ? `🎉 Level up! You're level ${lvlAfter}` : '',
  ]);
};

function celebrate(cat, lines) {
  const y = document.getElementById('yay');
  y.innerHTML = `<div class="big">Gotcha! 🎉</div><img src="${cat.thumb}" alt="">
    <div style="font-size:24px;font-weight:700">${esc(cat.name)}</div>
    ${lines.filter(Boolean).map(l => `<div style="margin-top:6px">${l}</div>`).join('')}
    <button class="btn" id="yayBtn">Yay!</button>`;
  y.classList.add('open');
  document.getElementById('yayBtn').onclick = () => y.classList.remove('open');
}

// ---------- My Cats ----------
function renderCollection() {
  const sorted = cats.slice().sort((a, b) => b.date - a.date);
  document.getElementById('colSub').textContent = cats.length
    ? `${cats.length} cat${cats.length === 1 ? '' : 's'} spotted` : '';
  document.getElementById('grid').innerHTML = sorted.map(c =>
    `<div class="photoCard" data-id="${c.id}" style="border-color:${RARITY[coatById(c.coat).r]}">
      <img src="${c.thumb}" alt="" loading="lazy">
      <div class="info"><div class="nm">${esc(c.name)}</div><small>${coatById(c.coat).name}${c.seen > 1 ? ` · seen ×${c.seen}` : ''}</small></div>
    </div>`).join('');
  document.getElementById('empty').innerHTML = cats.length ? '' :
    `${catSVG(COATS[0])}<p><b>No cats yet!</b></p><p>See a cat? Tap <b>📷 Spot a cat!</b> to snap it and start your collection.</p>`;
}
document.getElementById('grid').onclick = e => {
  const card = e.target.closest('.photoCard'); if (card) openDetail(card.dataset.id);
};

function openDetail(id) {
  const c = cats.find(x => x.id === id); if (!c) return;
  const coat = coatById(c.coat);
  document.getElementById('detailBox').innerHTML = `
    <img class="big" src="${c.photo}" alt="">
    <h2 style="margin-top:12px">${esc(c.name)}</h2>
    <span class="tag" style="background:${RARITY[coat.r]}">${coat.name}</span>
    <div class="meta" style="margin-top:10px">📅 First seen ${new Date(c.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}</div>
    <div class="meta">👀 Seen ${c.seen} time${c.seen === 1 ? '' : 's'}</div>
    ${c.note ? `<p>${esc(c.note)}</p>` : ''}
    <button class="btn" id="seenBtn">👋 I saw them again! (+${XP_SEEN_AGAIN} XP)</button>
    ${c.lat != null ? `<button class="btn ghost" id="showMapBtn">🗺️ Show on map</button>` : ''}
    <button class="btn ghost" id="closeDetail">Close</button>
    <button class="btn danger" id="delBtn">Delete this cat</button>`;
  const sheet = document.getElementById('detailSheet');
  sheet.classList.add('open');
  document.getElementById('closeDetail').onclick = () => sheet.classList.remove('open');
  document.getElementById('seenBtn').onclick = async () => {
    c.seen++; await putCat(c); renderAll(); openDetail(id); toast(`Hi again, ${c.name}! +${XP_SEEN_AGAIN} XP`);
  };
  const mb = document.getElementById('showMapBtn');
  if (mb) mb.onclick = () => { sheet.classList.remove('open'); showTab('map'); map.setView([c.lat, c.lng], 18); };
  document.getElementById('delBtn').onclick = async () => {
    if (!confirm(`Delete ${c.name}? This can't be undone.`)) return;
    await delCat(id); cats = cats.filter(x => x.id !== id);
    sheet.classList.remove('open'); renderAll();
  };
}
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => {
  if (e.target === s && s.id !== 'addSheet') s.classList.remove('open');
}));

// ---------- Catdex ----------
function renderDex() {
  const counts = {};
  cats.forEach(c => counts[c.coat] = (counts[c.coat] || 0) + 1);
  const found = Object.keys(counts).length;
  document.getElementById('dexSub').textContent = found === COATS.length
    ? `🏆 You found every coat type! Legend.` : `${found} / ${COATS.length} coat types found`;
  document.getElementById('dexGrid').innerHTML = COATS.map(c => {
    const n = counts[c.id] || 0;
    return `<div class="dexCard ${n ? '' : 'unseen'}" style="${n ? `border-color:${RARITY[c.r]}` : ''}">
      ${n ? `<div class="ct">×${n}</div>` : ''}${catSVG(c)}
      <div class="nm">${n ? c.name : '???'}</div></div>`;
  }).join('');
}

// ---------- Map ----------
let map = null, pinLayer = null;
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([51.5074, -0.1278], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  const placed = cats.filter(c => c.lat != null);
  if (placed.length) map.fitBounds(placed.map(c => [c.lat, c.lng]), { padding: [60, 60], maxZoom: 17 });
  else if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 16));
  if (navigator.geolocation) navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!initMap.me) initMap.me = L.marker(ll, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
    else initMap.me.setLatLng(ll);
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
function renderMap() {
  if (!map) return;
  pinLayer.clearLayers();
  cats.filter(c => c.lat != null).forEach(c => {
    L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', iconSize: [48, 48], iconAnchor: [24, 24],
      html: `<div class="pin" style="background-image:url(${c.thumb});border-color:${getComputedStyle(document.documentElement).getPropertyValue('--' + coatById(c.coat).r)}"></div>` }) })
      .on('click', () => openDetail(c.id)).addTo(pinLayer);
  });
}

// ---------- Tabs ----------
function showTab(t) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === t + 'View'));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'map') { if (!map) initMap(); map.invalidateSize(); renderMap(); }
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function renderAll() { renderHUD(); renderCollection(); renderDex(); renderMap(); }

// ---------- Go! ----------
openDB().then(loadAll).then(all => { cats = all || []; renderAll(); })
  .catch(() => { renderAll(); toast("Can't save photos in this browser (private mode?)", 4000); });
</script>
</body>
</html>
